# P38 专属测试覆盖：只通过显式 Compose project 使用，不得与开发栈叠加。
services:
  etcd:
    container_name: !reset null
    volumes:
      - sentinelops_e2e_etcd:/etcd

  minio:
    container_name: !reset null
    ports: !reset []
    volumes:
      - sentinelops_e2e_minio:/minio_data

  standalone:
    container_name: !reset null
    ports: !reset []
    volumes:
      - sentinelops_e2e_milvus:/var/lib/milvus

  attu:
    container_name: !reset null
    ports: !reset []

  redis:
    container_name: !reset null
    ports: !reset []
    volumes:
      - sentinelops_e2e_redis:/data
    command: ["redis-server", "--appendonly", "no"]

  mysql:
    container_name: !reset null
    image: mysql:8.0.43
    ports: !override
      - "127.0.0.1:${SENTINELOPS_E2E_MYSQL_PORT:-13306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: sentinelops-e2e-root-password
      MYSQL_DATABASE: sentinelops_e2e
    volumes:
      - sentinelops_e2e_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$${MYSQL_ROOT_PASSWORD} mysqladmin ping -h 127.0.0.1 -P 3306 -uroot --protocol=tcp --silent"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  migrate:
    profiles: !reset []
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: mysql
      GOOSE_DBSTRING: root:sentinelops-e2e-root-password@tcp(mysql:3306)/sentinelops_e2e?parseTime=true
    command: ["-dir", "/migrations", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  runtime-gates:
    image: mysql:8.0.43
    environment:
      MYSQL_PWD: sentinelops-e2e-root-password
    command:
      - sh
      - -ec
      - |
        mysql -hmysql -uroot sentinelops_e2e <<'SQL'
        INSERT INTO settings (`key`, `value`, updated_at) VALUES
          ('agent_runtime.enabled', 'true', CURRENT_TIMESTAMP(3)),
          ('agent_runtime.accept_new_runs', 'true', CURRENT_TIMESTAMP(3)),
          ('agent_runtime.shadow_mode', 'false', CURRENT_TIMESTAMP(3)),
          ('agent_runtime.l1_writes', 'true', CURRENT_TIMESTAMP(3)),
          ('agent_runtime.l2_writes', 'true', CURRENT_TIMESTAMP(3)),
          ('agent_runtime.admin_query_database_debug', 'false', CURRENT_TIMESTAMP(3)),
          ('mcp.enabled', 'false', CURRENT_TIMESTAMP(3)),
          ('skill.enabled', 'true', CURRENT_TIMESTAMP(3)),
          ('langfuse.enabled', 'false', CURRENT_TIMESTAMP(3))
        ON DUPLICATE KEY UPDATE value = VALUES(value), updated_at = CURRENT_TIMESTAMP(3);
        SQL
    depends_on:
      migrate:
        condition: service_completed_successfully

  provider-double:
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.provider-double
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    container_name: !reset null
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.backend.e2e
      args:
        SENTINELOPS_E2E_PROJECT: ${COMPOSE_PROJECT_NAME:-sentinelops-e2e}
    command: ["./server", "api"]
    environment:
      TZ: UTC
      SENTINELOPS_MYSQL_DSN: root:sentinelops-e2e-root-password@tcp(mysql:3306)/sentinelops_e2e?parseTime=true
      SENTINELOPS_JWT_SECRET: sentinelops-e2e-jwt-secret
      SENTINELOPS_ADMIN_PASSWORD: sentinelops-e2e-admin-password
      SENTINELOPS_MODEL_API_KEY: sentinelops-e2e-provider-key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      standalone:
        condition: service_started
      provider-double:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-gates:
        condition: service_completed_successfully
    dns: !reset []
    volumes: !reset []

  worker:
    container_name: !reset null
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.backend.e2e
      args:
        SENTINELOPS_E2E_PROJECT: ${COMPOSE_PROJECT_NAME:-sentinelops-e2e}
    command: ["./server", "worker"]
    environment:
      TZ: UTC
      SENTINELOPS_MYSQL_DSN: root:sentinelops-e2e-root-password@tcp(mysql:3306)/sentinelops_e2e?parseTime=true
      SENTINELOPS_JWT_SECRET: sentinelops-e2e-jwt-secret
      SENTINELOPS_ADMIN_PASSWORD: sentinelops-e2e-admin-password
      SENTINELOPS_MODEL_API_KEY: sentinelops-e2e-provider-key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      standalone:
        condition: service_started
      provider-double:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      runtime-gates:
        condition: service_completed_successfully
    dns: !reset []
    volumes: !override
      - sentinelops_e2e_nginx_blocklist:/app/nginx_blocklist
      - /var/run/docker.sock:/var/run/docker.sock:ro

  frontend:
    container_name: !reset null

  nginx:
    container_name: !reset null
    image: sentinelops-e2e-nginx
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.nginx.e2e
    ports: !override
      - "127.0.0.1:${SENTINELOPS_E2E_HTTP_PORT:-18080}:80"
    volumes: !override
      - sentinelops_e2e_nginx_blocklist:/app/nginx_blocklist
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started

networks:
  default:
    name: !reset null

volumes:
  sentinelops_e2e_etcd:
  sentinelops_e2e_minio:
  sentinelops_e2e_milvus:
  sentinelops_e2e_redis:
  sentinelops_e2e_mysql:
  sentinelops_e2e_nginx_blocklist:
