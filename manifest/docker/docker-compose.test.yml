name: sentinelops-test

services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
    command: ["etcd", "-advertise-client-urls=http://etcd:2379", "-listen-client-urls", "http://0.0.0.0:2379", "--data-dir", "/etcd"]
    tmpfs:
      - /etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    environment:
      MINIO_ACCESS_KEY: sentinelops-p04-access
      MINIO_SECRET_KEY: sentinelops-p04-secret
    command: ["minio", "server", "/minio_data"]
    tmpfs:
      - /minio_data

  standalone:
    image: milvusdb/milvus:v2.5.10
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    tmpfs:
      - /var/lib/milvus
    depends_on:
      - etcd
      - minio

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "no"]
    tmpfs:
      - /data

  mysql:
    image: mysql:8.0.43
    environment:
      MYSQL_ROOT_PASSWORD: sentinelops-p03-only
      MYSQL_DATABASE: sentinelops_p03
    ports:
      - "127.0.0.1::3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-psentinelops-p03-only"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    profiles: ["migration"]
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.migrate
    environment:
      GOOSE_DRIVER: mysql
      GOOSE_DBSTRING: root:sentinelops-p03-only@tcp(mysql:3306)/sentinelops_p03?parseTime=true
    command: ["-dir", "/migrations", "up"]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    profiles: ["bootstrap"]
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.backend
    command: ["./server", "api"]
    environment:
      SENTINELOPS_MYSQL_DSN: root:sentinelops-p03-only@tcp(mysql:3306)/sentinelops_p03?parseTime=true
      SENTINELOPS_JWT_SECRET: sentinelops-p04-jwt-secret
      SENTINELOPS_ADMIN_PASSWORD: sentinelops-p04-admin-password
      SENTINELOPS_MODEL_API_KEY: sentinelops-p04-model-key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      standalone:
        condition: service_started

  worker:
    profiles: ["bootstrap"]
    build:
      context: ../..
      dockerfile: manifest/docker/Dockerfile.backend
    command: ["./server", "worker"]
    environment:
      SENTINELOPS_MYSQL_DSN: root:sentinelops-p03-only@tcp(mysql:3306)/sentinelops_p03?parseTime=true
      SENTINELOPS_MODEL_API_KEY: sentinelops-p04-model-key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      standalone:
        condition: service_started
