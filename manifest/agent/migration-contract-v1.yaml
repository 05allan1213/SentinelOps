version: sentinelops.agent.migration-contract/v1
prompt_inputs:
  - query
  - history
  - documents
  - date
approved_least_privilege_deltas:
  - id: event-analysis-remove-save-intelligence
    contract: EventAnalysis durable inventory removes save_intelligence and its persistence instruction; Planner delegates persistence to Intelligence.
  - id: durable-remove-query-database
    contract: query_database is absent from every ordinary durable specialist inventory.
agents:
  - legacy_graph_name: EventAnalysisAgent
    name: event_analysis_agent
    description: "Call the Event Analysis Agent to query, analyze and correlate security events. Handles: recent events listing, CVE analysis, severity distribution, event timeline, subscription status, threat correlation. Returns structured analysis results."
    instruction_ref: agents.EventAnalysis
    instruction_sha256: b892d57dd6e1186e2a2a721d3537651cda07c92a811ea1ebc3bb1c499b2c4a45
    instruction_inputs: [date, documents]
    legacy_tool_inventory: [query_events, search_similar_events, query_subscriptions, query_reports, query_internal_docs, get_current_time, web_search, save_intelligence]
    tool_inventory: [query_events, search_similar_events, query_subscriptions, query_reports, query_internal_docs, get_current_time, web_search]
    return_directly: []
    max_iterations: 25
  - legacy_graph_name: ReportAgent
    name: report_agent
    description: "Call the Report Agent to generate structured security reports (weekly/monthly/custom). Handles: creating new reports, querying existing reports, fetching report templates, summarizing event trends. Returns report content or creation confirmation."
    instruction_ref: agents.Report
    instruction_sha256: 0d98cdac6a1579236c2a1710722e784ab616b1cc35b3984f452e37de918bd705
    instruction_inputs: [date, documents]
    legacy_tool_inventory: [query_events, query_reports, query_report_templates, search_similar_events, get_current_time, create_report, web_search]
    tool_inventory: [query_events, query_reports, query_report_templates, search_similar_events, get_current_time, create_report, web_search]
    return_directly: []
    max_iterations: 30
  - legacy_graph_name: RiskAgent
    name: risk_assessment_agent
    description: "Call the Risk Assessment Agent to evaluate CVE severity, attack paths, and impact scope. Handles: CVE risk scoring, vulnerability assessment, CVSS analysis, attack surface analysis, mitigation priority ranking. Returns structured risk assessment."
    instruction_ref: agents.Risk
    instruction_sha256: 77c50ddaaa7728075c5a825f644dfe034f820f02569634672329b645f1445d4d
    instruction_inputs: [date, documents]
    legacy_tool_inventory: [query_events, query_reports, search_similar_events, query_internal_docs, query_subscriptions, get_current_time, web_search]
    tool_inventory: [query_events, query_reports, search_similar_events, query_internal_docs, query_subscriptions, get_current_time, web_search]
    return_directly: []
    max_iterations: 25
  - legacy_graph_name: SolveAgent
    name: solve_agent
    description: "Call the Solve Agent to generate emergency response plans for specific security incidents. Handles: incident containment steps, patch recommendations, remediation procedures, recovery guidance for a single event. Returns structured three-phase response plan."
    instruction_ref: agents.Solve
    instruction_sha256: ab9712f33a9a2f979f7975d3b779ff71744c224761206261a264ddcaa98620cc
    instruction_inputs: [date, documents]
    legacy_tool_inventory: [search_similar_events, query_internal_docs, web_search]
    tool_inventory: [search_similar_events, query_internal_docs, web_search]
    return_directly: []
    max_iterations: 10
  - legacy_graph_name: IntelligenceAgent
    name: intelligence_agent
    description: "Call the Intelligence Agent to search and analyze the latest threat intelligence from the internet. Handles: CVE details lookup, vulnerability advisories, exploit PoC status, threat actor profiling, malicious IP/domain reputation. Automatically saves findings to the local knowledge base. Returns structured threat intelligence report."
    instruction_ref: agents.Intelligence
    instruction_sha256: 94ec08ec9be5765d4e84a38c339a4c86a676767a8216be68daf9d924772ebbef
    instruction_inputs: [date, documents]
    legacy_tool_inventory: [query_internal_docs, get_current_time, web_search, save_intelligence]
    tool_inventory: [query_internal_docs, get_current_time, web_search, save_intelligence]
    return_directly: []
    max_iterations: 12
  - legacy_graph_name: OpsAgent
    name: ops_agent
    description: "Call the Ops Agent to trigger automated incident response for a specific security event. Handles: IP blocking, multi-channel alert notifications (DingTalk/WeCom/Email), event status updates. Requires event_id in the query. Returns execution result."
    instruction_ref: agents.Ops
    instruction_sha256: 7269971407f7d63c508cadcc6338523347189f873df74288e3842d5b2025ac85
    instruction_inputs: [date]
    legacy_tool_inventory: [query_events, trigger_ops, update_event_status, block_ip, notify_dingtalk, notify_wecom, notify_email, get_current_time]
    tool_inventory: [query_events, trigger_ops, update_event_status, block_ip, notify_dingtalk, notify_wecom, notify_email, get_current_time]
    return_directly: []
    max_iterations: 20
