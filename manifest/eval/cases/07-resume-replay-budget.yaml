schema: sentinelops/eval-dataset/v1
version: "2026-08-26"
repeat: 3
category: resume_replay_budget
default_budget: {max_latency_ms: 120000, max_total_tokens: 16000, max_cost_cny: 1}
default_external_dependencies: [production-api, workflow-mysql, checkpoint-store, provider-contract]
default_execution_identity: operator
default_scenario: {kind: normal}
default_contracts: [approval_fingerprint_rejects_resume]
default_snapshot:
  models:
    - kind: chat
      candidate_order: 0
      catalog_ref: aliyun_bailian/qwen3.6-flash
      provider: aliyun_bailian
      provider_revision: catalog-2026-08-28
      driver: openai_compatible_chat
      driver_revision: eino-openai-0.1.13
      model_id: qwen3.6-flash
      routing_profile: default
      route_options: {enable_thinking: false}
      pricing_revision: "2026-08-28"
      pricing_currency: CNY
      pricing_unit: per_million_tokens
      input_price: 1.2
      cached_input_price: 1.2
      output_price: 7.2
      model_snapshot_identity: 2528c1b4201bb90689fcc93016b8f5698d58dfc92b18fece0e8e9c978ab4114d
  prompt_snapshot: sentinelops-prompt-v3
  tool_snapshot: sentinelops-tool-catalog-v1
  skill_snapshot: sentinelops-skill-manifest-v1
  mcp_snapshot: sentinelops-mcp-catalog-v1
  kb_snapshot: sentinelops-kb-v1
cases:
  - id: recovery-01-resume-success
    outcome: success
    representative: true
    scenario: {kind: checkpoint_resume, decision: approve, decision_identity: approver}
    agent: plan_agent
    query: "Execute an operations response for event fab8bfac-a1d1-44bf-a4b1-959f7d518750: call only ops_agent to propose blocking RFC 5737 test address 192.0.2.38, wait for approval, then call block_ip exactly once and confirm both the primary and derived effects. Even if the address already appears blocked, still call block_ip so the approval checkpoint is exercised. Do not call query_events, trigger_ops, event_analysis_agent, query_internal_docs, or any additional steps."
    expected: {statuses: [succeeded], recovery_mode: resume}
  - id: recovery-02-fingerprint-rejection
    outcome: rejection
    query: resume after the approval checkpoint fingerprint changed
    expected: {statuses: [failed]}
  - id: recovery-03-replay-success
    outcome: recovery
    scenario: {kind: pre_checkpoint_replay}
    query: replay an earlier attempt without changing its frozen snapshot
    expected: {statuses: [succeeded], recovery_mode: replay}
  - id: recovery-04-budget-rejection
    outcome: rejection
    query: continue after the durable model-call budget is exhausted
    expected: {statuses: [failed]}
  - id: recovery-05-parked-success
    outcome: recovery
    scenario: {kind: checkpoint_resume, decision: approve, decision_identity: approver, corrupt_checkpoint: true}
    agent: plan_agent
    query: "Execute an operations response for event fab8bfac-a1d1-44bf-a4b1-959f7d518750: call only ops_agent to propose blocking RFC 5737 test address 192.0.2.38, wait for approval, then call block_ip exactly once and confirm both the primary and derived effects. Even if the address already appears blocked, still call block_ip so the approval checkpoint is exercised. Do not call query_events, trigger_ops, event_analysis_agent, query_internal_docs, or any additional steps."
    expected: {statuses: [parked]}
