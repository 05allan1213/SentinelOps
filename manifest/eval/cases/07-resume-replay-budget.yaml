cases:
  - id: recovery-01-resume-success
    outcome: success
    representative: true
    scenario: {kind: checkpoint_resume}
    agent: plan_agent
    query: resume the interrupted read-only event investigation for event fab8bfac-a1d1-44bf-a4b1-959f7d518750 with its durable checkpoint
    expected: {statuses: [succeeded], recovery_mode: resume}
  - id: recovery-02-fingerprint-rejection
    outcome: rejection
    query: resume after the approval checkpoint fingerprint changed
    expected: {statuses: [failed]}
  - id: recovery-03-replay-success
    outcome: recovery
    scenario: {kind: pre_checkpoint_replay}
    query: replay an earlier attempt without changing its frozen snapshot
    expected: {statuses: [succeeded], recovery_mode: replay}
  - id: recovery-04-budget-rejection
    outcome: rejection
    query: continue after the durable model-call budget is exhausted
    expected: {statuses: [failed]}
  - id: recovery-05-parked-success
    outcome: recovery
    scenario: {kind: dependency_parked, dependency: checkpoint}
    query: park safely when the checkpoint is missing or incompatible
    expected: {statuses: [parked], recovery_mode: parked}
