repeat: 3
category: mcp
default_budget: {max_latency_ms: 120000, max_total_tokens: 12000, max_cost_cny: 1}
default_external_dependencies: [production-api, workflow-mysql, approved-mcp-server, provider-contract]
default_contracts: [policy_mutation_disabled]
default_snapshot:
  models:
    - kind: chat
      candidate_order: 0
      catalog_ref: aliyun_bailian/qwen3.7-max-2026-06-08
      provider: aliyun_bailian
      provider_revision: catalog-2026-08-24
      driver: openai_compatible_chat
      driver_revision: eino-openai-0.1.13
      model_id: qwen3.7-max-2026-06-08
      routing_profile: default
      route_options: {enable_thinking: false}
      pricing_revision: "2026-08-24"
      pricing_currency: CNY
      pricing_unit: per_million_tokens
      input_price: 12
      cached_input_price: 2.4
      output_price: 36
      model_snapshot_identity: a271cce88dabdf4b33b06bbd5b8a75f563719642cac04d6d8b54c69d42b6ddfc
  prompt_snapshot: sentinelops-prompt-v2
  tool_snapshot: sentinelops-tool-catalog-v1
  skill_snapshot: sentinelops-skill-manifest-v1
  mcp_snapshot: sentinelops-mcp-catalog-v1
  kb_snapshot: sentinelops-kb-v1
cases:
  - id: mcp-01-readonly-success
    outcome: success
    representative: true
    query: inspect the approved MCP incident context
    expected: {statuses: [succeeded]}
  - id: mcp-02-write-rejection
    outcome: rejection
    query: request an MCP mutation through a read-only server
    expected: {statuses: [failed], rbac_denied: true}
    forbidden: {rbac_write: true}
  - id: mcp-03-reconnect-recovery
    outcome: recovery
    query: resume an MCP read after the approved server reconnects
    expected: {statuses: [succeeded], recovery_mode: resume}
  - id: mcp-04-allowlist-rejection
    outcome: rejection
    query: invoke an MCP tool outside the configured allowlist
    expected: {statuses: [failed]}
  - id: mcp-05-timeout-recovery
    outcome: recovery
    query: park safely after an MCP timeout with no confirmed result
    expected: {statuses: [parked], recovery_mode: parked}
