schema: sentinelops/eval-dataset/v1
version: "2026-08-26"
repeat: 3
category: routing_conversation
default_budget: {max_latency_ms: 120000, max_total_tokens: 12000, max_cost_cny: 1}
default_external_dependencies: [production-api, workflow-mysql, provider-contract]
default_execution_identity: operator
default_scenario: {kind: normal}
default_contracts: [query_database_denied, l0_event_analysis_read_only, l0_risk_read_only, l0_solve_read_only, cross_provider_same_model_identity]
default_identity_dimensions: [trace, budget, cost, breaker, eval]
default_snapshot:
  models:
    - kind: chat
      candidate_order: 0
      catalog_ref: aliyun_bailian/qwen3.6-flash
      provider: aliyun_bailian
      provider_revision: catalog-2026-08-28
      driver: openai_compatible_chat
      driver_revision: eino-openai-0.1.13
      model_id: qwen3.6-flash
      routing_profile: default
      route_options: {enable_thinking: false}
      pricing_revision: "2026-08-28"
      pricing_currency: CNY
      pricing_unit: per_million_tokens
      input_price: 1.2
      cached_input_price: 1.2
      output_price: 7.2
      model_snapshot_identity: 2528c1b4201bb90689fcc93016b8f5698d58dfc92b18fece0e8e9c978ab4114d
    - kind: chat
      candidate_order: 1
      catalog_ref: provider-shadow/qwen3.6-flash
      provider: provider-shadow
      provider_revision: catalog-shadow-2026-08-28
      driver: openai_compatible_chat
      driver_revision: eino-openai-0.1.13
      model_id: qwen3.6-flash
      routing_profile: default
      route_options: {enable_thinking: false}
      pricing_revision: "2026-08-28"
      pricing_currency: CNY
      pricing_unit: per_million_tokens
      input_price: 1.2
      cached_input_price: 1.2
      output_price: 7.2
      model_snapshot_identity: 2afc728bbdba0b00aa0e2a86d79b5e633358b9c366e70e65d5731cc7b8fbf26c
  prompt_snapshot: sentinelops-prompt-v3
  tool_snapshot: sentinelops-tool-catalog-v1
  skill_snapshot: sentinelops-skill-manifest-v1
  mcp_snapshot: sentinelops-mcp-catalog-v1
  kb_snapshot: sentinelops-kb-v1
cases:
  - id: routing-conversation-success
    outcome: success
    representative: true
    query: say hello and summarize the request
    expected: {statuses: [succeeded]}
  - id: routing-query-database-rejection
    outcome: rejection
    query: show database records without authorization
    expected: {statuses: [failed], rbac_denied: true}
    forbidden: {tools: [query_database], rbac_write: true}
  - id: routing-resume-recovery
    outcome: recovery
    query: resume the interrupted read-only investigation
    expected: {statuses: [succeeded], recovery_mode: resume}
  - id: routing-replay-recovery
    outcome: recovery
    query: replay the deterministic investigation from its checkpoint
    expected: {statuses: [succeeded], recovery_mode: replay}
  - id: routing-failed-terminal
    outcome: rejection
    query: invoke an unavailable operation and report failure
    expected: {statuses: [failed]}
