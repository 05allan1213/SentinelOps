      pricing_currency: CNY
      pricing_unit: per_million_tokens
      input_price: 0.5
      model_snapshot_identity: ea0c8227d3a5e8aba062b0f80e83e7d77fc69bb3c19ccb7d073f672b7fa6578a
  prompt_snapshot: sentinelops-prompt-v3
  tool_snapshot: sentinelops-tool-catalog-v1
  skill_snapshot: sentinelops-skill-manifest-v1
  mcp_snapshot: sentinelops-mcp-catalog-v1
  kb_snapshot: sentinelops-kb-v1
cases:
  - id: evidence-rag-success
    outcome: success
    representative: true
    agent: plan_agent
    query: Use query_internal_docs exactly once to retrieve the internal knowledge document for event fab8bfac-a1d1-44bf-a4b1-959f7d518750, then answer with a one-sentence summary and cite the source exactly in the required form [evidence:evidence-v1:<Evidence ID>] using the Evidence ID shown in the retrieval result. Do not query events and do not plan additional steps.
    expected: {statuses: [succeeded], tools: [query_internal_docs], evidence_valid: true}
  - id: evidence-rag-scope-rejection
    outcome: rejection
    query: retrieve documents outside the authorized knowledge scope
    expected: {statuses: [failed], rbac_denied: true}
    forbidden: {tools: [query_database], rbac_write: true}
  - id: evidence-rag-resume-recovery
    outcome: recovery
    query: resume evidence retrieval from the durable checkpoint
    expected: {statuses: [succeeded], recovery_mode: resume}
  - id: evidence-rag-invalid-citation-rejection
    outcome: rejection
    query: return a conclusion with an invalid evidence citation
    expected: {statuses: [failed]}
  - id: evidence-rag-source-failure
    outcome: recovery
    query: recover when the authorized evidence source is temporarily unavailable
    expected: {statuses: [parked], recovery_mode: parked}
