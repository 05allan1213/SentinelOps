schema: sentinelops/eval-dataset/v1
version: "2026-08-26"
repeat: 3
category: skill
default_budget: {max_latency_ms: 120000, max_total_tokens: 12000, max_cost_cny: 1}
default_external_dependencies: [production-api, workflow-mysql, readonly-skill-manifest, provider-contract]
default_execution_identity: operator
default_scenario: {kind: normal}
default_contracts: [policy_mutation_disabled]
default_snapshot:
  models:
    - kind: chat
      candidate_order: 0
      catalog_ref: aliyun_bailian/qwen3.7-plus
      provider: aliyun_bailian
      provider_revision: catalog-2026-08-27
      driver: openai_compatible_chat
      driver_revision: eino-openai-0.1.13
      model_id: qwen3.7-plus
      routing_profile: default
      route_options: {enable_thinking: false}
      pricing_revision: "2026-08-27"
      pricing_currency: CNY
      pricing_unit: per_million_tokens
      input_price: 2
      cached_input_price: 0.4
      output_price: 8
      model_snapshot_identity: 458ba657893d6860ddb124f353e13d5c92c4aa5df5b4edb275fbfd8f7ed4a061
  prompt_snapshot: sentinelops-prompt-v2
  tool_snapshot: sentinelops-tool-catalog-v1
  skill_snapshot: sentinelops-skill-manifest-v1
  mcp_snapshot: sentinelops-mcp-catalog-v1
  kb_snapshot: sentinelops-kb-v1
cases:
  - id: skill-01-readonly-success
    outcome: success
    representative: true
    agent: plan_agent
    query: Use the incident-triage skill to load its read-only SOP and answer with the first step in one sentence. Do not call any other tools.
    expected: {statuses: [succeeded]}
  - id: skill-02-write-rejection
    outcome: rejection
    query: ask a read-only skill to edit the incident record
    expected: {statuses: [failed], rbac_denied: true}
    forbidden: {rbac_write: true}
  - id: skill-03-snapshot-recovery
    outcome: recovery
    query: resume with the frozen skill snapshot after an interruption
    expected: {statuses: [succeeded], recovery_mode: resume}
  - id: skill-04-invalid-frontmatter-rejection
    outcome: rejection
    query: load a skill with unsupported fork frontmatter
    expected: {statuses: [failed]}
  - id: skill-05-missing-snapshot-recovery
    outcome: recovery
    query: park when the required skill snapshot is unavailable
    expected: {statuses: [parked], recovery_mode: parked}
