app:
  environment: "development"

server:
  address: ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: 52428800  # 50 MB，防止超大文件上传打爆内存
  enable_frontend_hosting: false

logger:
  level: "all"
  stdout: true

model_reliability:
  retry: {max_retries: 1, base_backoff_ms: 100}
  breaker: {failure_threshold: 5, open_timeout_ms: 30000}
  limiter: {qps: 10, burst: 20}

# 模型访问分为 Provider -> Model Catalog -> Routing 三层。下方百炼配置只是当前
# 开发示例；业务代码按 provider/model 引用动态解析，不绑定固定供应商。
# 本文件只保存 Secret 引用；开发环境可在被忽略的完整 local 配置中改用 file 引用。
providers:
  aliyun_bailian:
    secret_ref: "env:SENTINELOPS_MODEL_API_KEY"
    endpoints:
      openai_compatible_chat: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      openai_compatible_embedding: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      dashscope_compatible_rerank: "https://dashscope.aliyuncs.com/compatible-api/v1"

# 价格：中国内地（北京）地域，人民币/百万 Token，仅按付费价估算。
# 来源：https://help.aliyun.com/zh/model-studio/model-pricing
# 核对日期：2026-08-28；不计入免费额度。glm-5、qwen3.6-plus 免费额度先后耗尽后
# 按用户要求切换；qwen-plus 在嵌套工具名与硬约束上不稳定，最终切换到 qwen3-max
# （列表价输入 2.5 元、缓存命中 0.5 元、输出 10 元，北京地域输入 <=32K 档）。
# 流式响应固定 enable_thinking=false 以保证工具调用稳定。
model_catalog:
  aliyun_bailian/qwen3-max:
    model_id: "qwen3-max"
    driver: "openai_compatible_chat"
    capabilities: ["chat", "tool_calling"]
    pricing:
      revision: "2026-08-28"
      currency: "CNY"
      unit: "per_million_tokens"
      input: 2.5
      cached_input: 0.5
      output: 10
  aliyun_bailian/qwen3.7-text-embedding:
    model_id: "qwen3.7-text-embedding"
    driver: "openai_compatible_embedding"
    capabilities: ["embedding"]
    dimension: 2048
    pricing:
      revision: "2026-08-24"
      currency: "CNY"
      unit: "per_million_tokens"
      input: 0.5
  aliyun_bailian/qwen3-rerank:
    model_id: "qwen3-rerank"
    driver: "dashscope_compatible_rerank"
    capabilities: ["rerank"]
    pricing:
      revision: "2026-08-24"
      currency: "CNY"
      unit: "per_million_tokens"
      input: 0.5

routing:
  chat:
    default:
      candidates:
        - model: "aliyun_bailian/qwen3-max"
          options:
            enable_thinking: false
    reasoning:
      candidates:
        - model: "aliyun_bailian/qwen3-max"
          options:
            enable_thinking: false
  embedding:
    default:
      model: "aliyun_bailian/qwen3.7-text-embedding"
  rerank:
    default:
      model: "aliyun_bailian/qwen3-rerank"
      options:
        instruct: "Given a web search query, retrieve relevant passages that answer the query."

# 内部文档知识库根目录（query_internal_docs 工具扫描此路径）
file_dir: "docs"

milvus:
  addr: "localhost:19530"

redis:
  addr: "localhost:16379"
  password: ""
  db: 0

  # 对话历史缓存：多轮对话上下文持久化到 Redis，服务重启后可恢复
  chat_cache:
    ttl: 720            # 缓存有效期（小时），720h = 30 天
    key_prefix: "session"

  # 语义缓存：对 RAG 检索结果缓存，相似度命中时跳过 Embedding + Milvus 调用
  semantic_cache:
    ttl: 24             # 缓存有效期（小时）
    threshold: 0.85     # 余弦相似度命中阈值，高于此值视为缓存命中
    key_prefix: "rag:cache"
    topk: 5             # Milvus 初始召回候选文档数（扩大候选池，提升召回率）
    final_topk: 3       # 返回给 LLM 的最终文档数（从候选池截取，topk >= final_topk）
    min_score: 0.30     # 向量检索结果最低相似度阈值，低于此值的文档丢弃

# 检索增强（RAG）
retriever:
  # 查询重写：消除多轮对话中的代词歧义、补全上下文，增加约 200ms 延迟
  rewrite_enabled: true
  # 子问题拆分：将复杂查询拆分为多个子查询并行检索，增加约 300ms 延迟
  split_enabled: true
  # 意图置信度阈值：低于此值时返回歧义引导提示，而非强制路由
  confidence_threshold: 0.70

  # 混合检索：Sparse-Dense 混合检索（BM25 + 语义向量，RRF 融合）
  hybrid:
    enabled: true         # 是否启用混合检索（events/documents 分区默认启用）
    rrf_k: 60             # RRF 融合参数 k（Reciprocal Rank Fusion）

database:
  mysql:
    dsn_ref: "env:SENTINELOPS_MYSQL_DSN"

# 认证
auth:
  jwt:
    enabled: true                     # 生产环境建议设为 true
    secret_ref: "env:SENTINELOPS_JWT_SECRET"
    expire_hours: 24
  seed:
    admin_password_ref: "env:SENTINELOPS_ADMIN_PASSWORD"

# 后续 MCP、SMTP 与 Effect 调用只消费同一 Resolver 的引用。
secret_refs:
  mcp_header: ""
  effect: ""

# MCP 默认关闭；启用时每个 Server 必须显式配置 Tool、Host、Port 与 Transport。
# Header 只允许 Secret 引用，不能填写 Authorization 明文。
mcp:
  enabled: false
  servers: {}

skill:
  enabled: false
  base_dir: "manifest/skills"
  max_bytes: 65536

agent_runtime:
  enabled: false
  accept_new_runs: false
  shadow_mode: false
  l1_writes: false
  l2_writes: false
  admin_query_database_debug: false

observability:
  langfuse:
    enabled: false
    host: "https://cloud.langfuse.com"
    public_key_ref: "env:SENTINELOPS_LANGFUSE_PUBLIC_KEY"
    secret_key_ref: "env:SENTINELOPS_LANGFUSE_SECRET_KEY"
    service_name: "sentinelops"
    sample_rate: 1
    timeout_ms: 10000
    max_attribute_value_length: 65536
    max_span_attribute_bytes: 262144
    shutdown_timeout_ms: 10000
  retention:
    enabled: true
    lease_duration_ms: 30000
    interval_ms: 3600000
    batch_size: 100

# 后台调度器
scheduler:
  fetch_interval_minutes: 15  # 订阅源抓取间隔（分钟）
  index_interval_minutes: 20  # 向量索引间隔（分钟）
  index_batch_size: 10        # 单批向量化文档数，受 DashScope Embedding API 上限约束（≤ 10）

# 对话记忆管理
memory:
  summaryTrigger: 30    # 消息数辅助触发阈值：超过此条数触发摘要压缩
  summaryBatchSize: 10  # 每次摘要压缩的消息条数
  tokenTrigger: 3000    # Token 主触发阈值：累计 Token 超出时触发摘要压缩
  minRecentMessages: 4  # 摘要后最少保留的近期消息数（保证对话连贯性）
  inferDebounceMinutes: 5 # 用户偏好推断防抖间隔（分钟）

# 工具
tools:
  web_search:
    # Tavily Search API，专为 AI Agent 设计，申请地址：https://tavily.com
    tavily_api_key: ""
    tavily_base_url: "https://api.tavily.com/search"
    tavily_search_depth: "advanced"   # basic（快速）| advanced（深度，结果更全）
  github:
    token: ""   # GitHub Personal Access Token，用于提高 API 限流额度

# 全链路追踪
trace:
  enabled: true
  max_error_length: 1000
  record_prompt: false        # 是否记录 Prompt/Completion 原文（开启将显著增加写入量）
  record_sql: true           # 是否记录 SQL 语句（开启将记录慢查询 SQL 原文）
  db_slow_threshold_ms: 100   # 慢查询阈值（毫秒），超过此值的查询才会被追踪
  # 模型单价（¥/1M tokens，直接填写人民币，无需汇率换算）
  # 键名与 TraceNode.model_name 字段值匹配（大小写不敏感前缀匹配）

# 限流
limiter:
  # 全局 QPS 上限（所有用户共享，防接口被整体打爆）
  rate_global_qps: 100
  # 单用户 QPS 上限（按模块隔离）
  rate_chat_qps: 2           # AI 对话（消耗 LLM，严格限制）
  rate_event_qps: 5          # 事件分析（中等成本）
  rate_knowledge_qps: 10     # 知识库写操作
  rate_query_qps: 30         # 只读查询（trace/rageval/dashboard）
  rate_user_qps: 20          # 默认
  # Agent 执行超时（秒）
  agent_timeout_sec: 90
  agent_deep_timeout_sec: 600

knowledge:
  upload_dir: "manifest/upload/knowledge"  # 上传文件本地保存根目录
  index_workers: 3                          # 索引 Worker Pool 并发数
  queue_capacity: 1000                      # 索引任务队列容量
  default_kb_name: "默认知识库"
  parent_chunk_size: 1024                   # 父块大小（rune 数，hierarchical 策略）
  child_chunk_size: 256                     # 子块大小（rune 数）
  child_overlap_size: 40                    # 子块重叠窗口（rune 数）

# SOAR 集成配置
soar:
  integrations:
    dingtalk:
      webhook_ref: ""       # 钉钉机器人 Webhook URL Secret 引用
    wecom:
      webhook_ref: ""       # 企微机器人 Webhook URL Secret 引用
    email:
      smtp_host: ""         # SMTP 服务器地址
      smtp_port: ""                 # SMTP 端口
      smtp_user: ""    # 发件人邮箱
      smtp_password_ref: "env:SENTINELOPS_SMTP_PASSWORD"

  # AI 运维配置：控制 AI 规划时可使用的动作和通知渠道
  ai_ops:
    # 通知渠道偏好（AI 规划时优先使用已配置的渠道）
    # 可选值：dingtalk / wecom / email / none
    notify_channel: "email"
    # 通知收件人（email 渠道时使用）
    notify_email_to: ""
    # 是否允许 AI 封禁 IP（高危场景）
    allow_block_ip: true
    # IP 封禁后端：none（仅记录）/ nginx（写黑名单文件+reload）
    block_ip_backend: "none"
    # nginx 黑名单文件路径
    nginx_blocklist_path: ""
    # nginx 容器名
    nginx_container: ""
    # 是否允许 AI 调用深度分析
    allow_ai_analyze: true
