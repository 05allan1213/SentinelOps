app:
  environment: "production"

server:
  address: ":8001"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"
  clientMaxBodySize: 52428800  # 50 MB，防止超大文件上传打爆内存
  enable_frontend_hosting: false

logger:
  level: "all"
  stdout: true

model_reliability:
  retry: {max_retries: 1, base_backoff_ms: 100}
  breaker: {failure_threshold: 5, open_timeout_ms: 30000}
  limiter: {qps: 10, burst: 20}

# 模型访问分为 Provider -> Model Catalog -> Routing 三层。下方百炼配置只是当前
# 开发示例；业务代码按 provider/model 引用动态解析，不绑定固定供应商。
# 本文件只保存 Secret 引用，容器通过环境变量即时注入解析值。
providers:
  aliyun_bailian:
    secret_ref: "env:SENTINELOPS_MODEL_API_KEY"
    endpoints:
      openai_compatible_chat: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      openai_compatible_embedding: "https://dashscope.aliyuncs.com/compatible-mode/v1"
      dashscope_compatible_rerank: "https://dashscope.aliyuncs.com/compatible-api/v1"

# 价格：中国内地（北京）地域，人民币/百万 Token，仅按付费价估算。
# 来源：https://help.aliyun.com/zh/model-studio/model-pricing
# 核对日期：2026-08-24；不计入免费额度。
model_catalog:
  aliyun_bailian/qwen3.7-max-2026-06-08:
    model_id: "qwen3.7-max-2026-06-08"
    driver: "openai_compatible_chat"
    capabilities: ["chat", "tool_calling"]
    pricing: {revision: "2026-08-24", currency: "CNY", unit: "per_million_tokens", input: 12, cached_input: 2.4, output: 36}
  aliyun_bailian/qwen3.7-text-embedding:
    model_id: "qwen3.7-text-embedding"
    driver: "openai_compatible_embedding"
    capabilities: ["embedding"]
    dimension: 2048
    pricing: {revision: "2026-08-24", currency: "CNY", unit: "per_million_tokens", input: 0.5}
  aliyun_bailian/qwen3-rerank:
    model_id: "qwen3-rerank"
    driver: "dashscope_compatible_rerank"
    capabilities: ["rerank"]
    pricing: {revision: "2026-08-24", currency: "CNY", unit: "per_million_tokens", input: 0.5}

routing:
  chat:
    default:
      candidates:
        - model: "aliyun_bailian/qwen3.7-max-2026-06-08"
          options: {enable_thinking: false}
    reasoning:
      candidates:
        - model: "aliyun_bailian/qwen3.7-max-2026-06-08"
          options: {enable_thinking: true}
  embedding:
    default: {model: "aliyun_bailian/qwen3.7-text-embedding"}
  rerank:
    default:
      model: "aliyun_bailian/qwen3-rerank"
      options:
        instruct: "Given a web search query, retrieve relevant passages that answer the query."

# 内部文档知识库根目录（query_internal_docs 工具扫描此路径）
file_dir: "docs"

milvus:
  addr: "standalone:19530"

redis:
  addr: "redis:6379"
  password: ""
  db: 0

  # 对话历史缓存：多轮对话上下文持久化到 Redis，服务重启后可恢复
  chat_cache:
    ttl: 720
    key_prefix: "session"

  # 语义缓存：对 RAG 检索结果缓存，相似度命中时跳过 Embedding + Milvus 调用
  semantic_cache:
    ttl: 24
    threshold: 0.85
    key_prefix: "rag:cache"
    topk: 5
    final_topk: 3
    min_score: 0.30

# 检索增强（RAG）
retriever:
  rewrite_enabled: true
  split_enabled: true
  confidence_threshold: 0.70

  hybrid:
    enabled: true
    rrf_k: 60

database:
  mysql:
    dsn_ref: "env:SENTINELOPS_MYSQL_DSN"

# 认证
auth:
  jwt:
    enabled: true
    secret_ref: "env:SENTINELOPS_JWT_SECRET"
    expire_hours: 24
  seed:
    admin_password_ref: "env:SENTINELOPS_ADMIN_PASSWORD"

secret_refs:
  mcp_header: ""
  effect: ""

agent_runtime:
  enabled: false
  accept_new_runs: false
  shadow_mode: false
  admin_query_database_debug: false

# 后台调度器
scheduler:
  fetch_interval_minutes: 15
  index_interval_minutes: 20
  index_batch_size: 10

# 对话记忆管理
memory:
  summaryTrigger: 30
  summaryBatchSize: 10
  tokenTrigger: 3000
  minRecentMessages: 4

# 工具
tools:
  web_search:
    tavily_api_key: ""
    tavily_base_url: "https://api.tavily.com/search"
    tavily_search_depth: "advanced"
  github:
    token: ""

# 全链路追踪
trace:
  enabled: true
  max_error_length: 1000
  record_prompt: false
  record_sql: true
  db_slow_threshold_ms: 100

# 限流
limiter:
  rate_global_qps: 100
  rate_chat_qps: 2
  rate_event_qps: 5
  rate_knowledge_qps: 10
  rate_query_qps: 30
  rate_user_qps: 20
  agent_timeout_sec: 90
  agent_deep_timeout_sec: 300

knowledge:
  upload_dir: "manifest/upload/knowledge"
  index_workers: 3
  queue_capacity: 1000
  default_kb_name: "默认知识库"
  parent_chunk_size: 1024
  child_chunk_size: 256
  child_overlap_size: 40

# SOAR 集成配置
soar:
  integrations:
    dingtalk:
      webhook_ref: ""
    wecom:
      webhook_ref: ""
    email:
      smtp_host: ""
      smtp_port: ""
      smtp_user: ""
      smtp_password_ref: "env:SENTINELOPS_SMTP_PASSWORD"

  ai_ops:
    notify_channel: "email"
    notify_email_to: ""
    allow_block_ip: true
    block_ip_backend: "nginx"
    nginx_blocklist_path: "/app/nginx_blocklist/blocked_ips.conf"
    nginx_container: "nginx"
    allow_ai_analyze: true
