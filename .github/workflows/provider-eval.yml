name: Scheduled provider Runtime Eval

on:
  workflow_dispatch:
  schedule:
    - cron: "17 18 * * 3"

permissions:
  contents: read

concurrency:
  group: provider-eval
  cancel-in-progress: false

jobs:
  provider-eval:
    name: Provider preflight and production Runtime Dataset
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      SENTINELOPS_MODEL_API_KEY: ${{ secrets.SENTINELOPS_MODEL_API_KEY }}
      SENTINELOPS_EVAL_DSN: ${{ secrets.SENTINELOPS_EVAL_DSN }}
      SENTINELOPS_EVAL_AUTHORIZATION: ${{ secrets.SENTINELOPS_EVAL_AUTHORIZATION }}
      SENTINELOPS_EVAL_BASE_URL: ${{ vars.SENTINELOPS_EVAL_BASE_URL }}
      SENTINELOPS_P41_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/p41/provider-eval
      SENTINELOPS_PROVIDER_EVAL_TIMEOUT: 150m
      SENTINELOPS_PROVIDER_EVAL_REPEAT: "3"
    steps:
      # actions/checkout v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # actions/setup-go v6.5.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Run provider preflights and production Runtime Eval
        run: scripts/ci/provider-eval.sh
      # actions/upload-artifact v4.6.2
      - name: Upload redacted provider report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sentinelops-provider-eval-${{ github.run_id }}
          path: .artifacts/p41/provider-eval
          if-no-files-found: error
          retention-days: 30
